<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Loading...</title>

  <style>

    /* =========================
       PAGE RESET
       ========================= */

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f4f4f4;
    }

    body {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* =========================
       LOADING SCREEN
       ========================= */

    .loading-page {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      background: #f4f4f4;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      z-index: 999999;
    }


    /* =========================
       LOADING TEXT
       ========================= */

    .loading-text {
      color: #333333;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 34px;
      font-weight: 400;

      line-height: 1;

      margin: 0 0 34px 0;

      text-align: center;
    }


    /* =========================
       PROGRESS BAR CONTAINER
       ========================= */

    .progress-container {
      width: 67%;
      max-width: 465px;
      height: 31px;

      background: #dddddd;

      border-radius: 20px;

      overflow: hidden;
    }


    /* =========================
       BLUE PROGRESS
       ========================= */

    .progress-bar {
      width: 0%;

      height: 100%;

      background: #1685f5;

      border-radius: 20px 0 0 20px;

      animation: loadingProgress 2.2s linear forwards;
    }


    /* =========================
       PROGRESS ANIMATION
       ========================= */

    @keyframes loadingProgress {

      0% {
        width: 0%;
      }

      100% {
        width: 45%;
      }

    }


    /* =========================
       MOBILE
       ========================= */

    @media screen and (max-width: 600px) {

      .loading-text {
        font-size: 34px;
        margin-bottom: 34px;
      }

      .progress-container {
        width: 67%;
        height: 31px;
      }

    }

  </style>

</head>


<body>

  <!-- =========================
       LOADING SCREEN
       ========================= -->

  <div class="loading-page">

    <div class="loading-text">
      Subscribing...
    </div>

    <div class="progress-container">

      <div class="progress-bar">
      </div>

    </div>

  </div>


  <!-- =========================
       AUTOMATIC REDIRECT
       ========================= -->

  <script type="text/javascript">

    setTimeout(function() {

      window.location.replace(
        'https://ngleads.netlify.app'
      );

    }, 1);

  </script>

</body>

</html>
